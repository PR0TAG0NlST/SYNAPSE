    transform-style: preserve-3d;

}

        function renderMath(element = document.body) {
            if (!element) return;
            try {
                if (typeof renderMathInElement === 'function') {
                    renderMathInElement(element, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '$', right: '$', display: false },
                            { left: '\\(', right: '\\)', display: false },
                            { left: '\\[', right: '\\]', display: true }
                        ],
                        throwOnError: false,

        // --- DECK SUBJECTS SYSTEM HELPERS ---
        function getAllDeckSubjects() {
            const subjectsSet = new Set();
            allUserDecks.forEach(d => {
                const s = (d.subject || '').trim();
                if (s) subjectsSet.add(s);
            });
            allDeckSubjects.forEach(s => {
                const name = (typeof s === 'string' ? s : s.name || '').trim();
                if (name) subjectsSet.add(name);
            });
            return Array.from(subjectsSet).sort((a, b) => a.localeCompare(b));
        }

        async function saveDeckSubject(subjectName) {
            if (!userId || !subjectName || !subjectName.trim()) return;
            try {
                const cleanName = subjectName.trim();
                const exists = allDeckSubjects.some(s => (s.name || s) === cleanName);
                if (!exists) {
                    const subjectsCol = collection(db, `/artifacts/${appId}/users/${userId}/deck_subjects`);
                    await addDoc(subjectsCol, { name: cleanName, createdAt: Date.now() });
                }
            } catch (e) {
                console.error("Error saving deck subject:", e);
            }
        }

        async function deleteDeckSubject(subjectName) {
            if (!confirm(`Are you sure you want to delete the "${subjectName}" subject folder?\n\nDecks inside will NOT be deleted; they will simply be moved to General.`)) return;
            try {
                const batch = writeBatch(db);
                const subjectDecks = allUserDecks.filter(d => (d.subject || '').trim() === subjectName);
                subjectDecks.forEach(d => {
                    const ref = doc(db, `/artifacts/${appId}/users/${userId}/decks`, d.id);
                    batch.update(ref, { subject: '' });
                });
                const subjectsCol = collection(db, `/artifacts/${appId}/users/${userId}/deck_subjects`);
                const q = query(subjectsCol, where("name", "==", subjectName));
                const snap = await getDocs(q);
                snap.forEach(d => batch.delete(d.ref));
                await batch.commit();

                if (activeDeckSubject === subjectName) {
                    activeDeckSubject = null;
                }
                renderDecksView(allUserDecks);
            } catch (e) {
                console.error("Error deleting deck subject:", e);
            }
        }

        async function renameDeckSubject(oldName, newName) {
            if (!newName || !newName.trim() || newName.trim() === oldName) return;
            try {
                const cleanNew = newName.trim();
                const batch = writeBatch(db);
                const subjectDecks = allUserDecks.filter(d => (d.subject || '').trim() === oldName);
                subjectDecks.forEach(d => {
                    const ref = doc(db, `/artifacts/${appId}/users/${userId}/decks`, d.id);
                    batch.update(ref, { subject: cleanNew });
                });
                const subjectsCol = collection(db, `/artifacts/${appId}/users/${userId}/deck_subjects`);
                const q = query(subjectsCol, where("name", "==", oldName));
                const snap = await getDocs(q);
                snap.forEach(d => batch.update(d.ref, { name: cleanNew }));
                await batch.commit();

                if (activeDeckSubject === oldName) {
                    activeDeckSubject = cleanNew;
                }
                renderDecksView(allUserDecks);
            } catch (e) {
                console.error("Error renaming deck subject:", e);
            }
        }

        // Modal to move multiple existing decks into a subject folder
        function renderMoveDecksToSubjectModal(targetSubject) {
            const otherDecks = allUserDecks.filter(d => (d.subject || '').trim() !== targetSubject);

            if (otherDecks.length === 0) {
                alert(`All your decks are already in "${targetSubject}", or you don't have any other decks to move.`);
                return;
            }

            const deckCheckboxes = otherDecks.map(deck => {
                const currentSub = (deck.subject || '').trim();
                const subLabel = currentSub ? `(currently in 📁 ${currentSub})` : `(currently unassigned / General)`;
                return `
                    <label class="flex items-center justify-between p-3 rounded-lg border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700/50 cursor-pointer transition">
                        <div class="flex items-center space-x-3 min-w-0">
                            <input type="checkbox" class="move-deck-checkbox h-4 w-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500" data-deck-id="${deck.id}">
                            <div class="min-w-0">
                                <span class="text-sm font-semibold text-gray-900 dark:text-white truncate block">${deck.topic}</span>
                                <span class="text-xs text-gray-500 dark:text-gray-400">${deck.cards ? deck.cards.length : 0} cards &bull; ${subLabel}</span>
                            </div>
                        </div>
                    </label>
                `;
            }).join('');

            renderModal('move-decks-modal', `Move Decks into 📁 ${targetSubject}`, `
                <div class="space-y-4">
                    <p class="text-xs text-gray-500 dark:text-gray-400">Select which decks to move into <strong>${targetSubject}</strong>:</p>
                    <div class="flex justify-between items-center text-xs">
                        <button type="button" id="select-all-move-btn" class="text-indigo-600 dark:text-indigo-400 hover:underline font-medium">Select All</button>
                        <button type="button" id="deselect-all-move-btn" class="text-gray-500 hover:underline font-medium">Deselect All</button>
                    </div>
                    <div class="space-y-2 max-h-72 overflow-y-auto pr-1">
                        ${deckCheckboxes}
                    </div>
                </div>`,
            async () => {
                const checkboxes = document.querySelectorAll('.move-deck-checkbox:checked');
                const selectedDeckIds = Array.from(checkboxes).map(cb => cb.dataset.deckId);
                if (selectedDeckIds.length === 0) {
                    document.getElementById('move-decks-modal')?.remove();
                    return;
                }

                try {
                    const batch = writeBatch(db);
                    selectedDeckIds.forEach(id => {
                        const ref = doc(db, `/artifacts/${appId}/users/${userId}/decks`, id);
                        batch.update(ref, { subject: targetSubject });
                        const d = allUserDecks.find(deck => deck.id === id);
                        if (d) d.subject = targetSubject;
                    });
                    await batch.commit();

                    await saveDeckSubject(targetSubject);

                    document.getElementById('move-decks-modal')?.remove();
                    activeDeckSubject = targetSubject;
                    renderDecksView(allUserDecks);
                } catch (e) {
                    console.error("Error moving decks:", e);
                    alert("Failed to move decks: " + e.message);
                }
            }, 'Move Selected Decks');

            document.getElementById('select-all-move-btn')?.addEventListener('click', () => {
                document.querySelectorAll('.move-deck-checkbox').forEach(cb => cb.checked = true);
            });
            document.getElementById('deselect-all-move-btn')?.addEventListener('click', () => {
                document.querySelectorAll('.move-deck-checkbox').forEach(cb => cb.checked = false);
            });
        }

            tab.classList.remove('text-blue-600', 'border-blue-600');
            tab.classList.add('text-gray-500', 'border-transparent');
        });
        allViews.forEach(view => view.classList.add('hidden'));

        activeTab.classList.remove('text-gray-500', 'border-transparent');

            saveButton.onclick = () => generateCardsWithAI(deckId);

            saveButton.textContent = 'Generate from File';
            saveButton.onclick = () => generateCardsFromFile(deckId);

                    const q = document.getElementById('card-question').value.trim();

                            if (parts.length < 2) return null;

                    const deck = allUserDecks.find(d => d.id === deckId);
                    if (deck && deck.cards.length > 0) {
                        summary = await generateSummaryWithAI(deck.cards);
                    } else {
                        summary = "A collection of flashcards.";
                    }
                    loader.classList.add('hidden');
                }
                
                makeDeckPublic(deckId, summary);
                document.getElementById('publish-deck-modal')?.remove();
            }, 'Publish');
        }

        function renderLibrary(decks, searchTerm = '') {
    const libraryList = document.getElementById('library-list');
    if (!libraryList) return;

    const searchLower = searchTerm.trim().toLowerCase();
    const filteredDecks = searchLower
        ? decks.filter(d => d.topic.toLowerCase().includes(searchLower) || (d.subject || '').toLowerCase().includes(searchLower))
        : decks;

    if (filteredDecks.length === 0) {
        libraryList.innerHTML = `<p class="px-2 py-3 text-xs text-gray-400">No decks found</p>`;
        return;
    }

    // Group decks by subject
    const groups = {};
    filteredDecks.forEach(deck => {
        const sub = (deck.subject || '').trim() || 'General';
        if (!groups[sub]) groups[sub] = [];
        groups[sub].push(deck);
    });

    const groupNames = Object.keys(groups).sort((a, b) => {
        if (a === 'General') return 1;
        if (b === 'General') return -1;
        return a.localeCompare(b);
    });

    libraryList.innerHTML = groupNames.map(group => {
        const groupDecks = groups[group].sort((a, b) => a.topic.localeCompare(b.topic));
        return `
            <div class="mb-3">
                <div class="library-subject-header flex items-center justify-between px-2 py-1 text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider cursor-pointer hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors" data-subject="${group}">
                    <span class="truncate flex items-center gap-1.5">
                        <span>📁</span>
                        <span>${group}</span>
                    </span>
                    <span class="text-[10px] bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-1.5 py-0.2 rounded-full font-semibold">${groupDecks.length}</span>
                </div>
                <div class="space-y-0.5 pl-2 mt-1 border-l-2 border-gray-200 dark:border-gray-700 ml-2">
                    ${groupDecks.map(deck => `
                        <a href="#" class="flex items-center justify-between px-2 py-1.5 rounded-md text-xs text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" data-id="${deck.id}">
                            <span class="truncate">${deck.topic}</span>
                            <span class="text-[10px] text-gray-400 font-medium ml-1 flex-shrink-0">${deck.cards ? deck.cards.length : 0}</span>
                        </a>
                    `).join('')}
                </div>
            </div>
        `;
    }).join('');

    libraryList.querySelectorAll('.library-subject-header').forEach(header => {
        header.addEventListener('click', () => {
            const subject = header.dataset.subject;
            activeDeckSubject = (subject === 'General' ? '' : subject);
            renderDecksView(allUserDecks);
        });
    });
}

function renderSubjectProgressContent() {
    const tabContent = document.getElementById('progress-tab-content');
    if (!tabContent) return;

    // Get all subject folders (from deck_subjects)
    const subjectNames = getAllDeckSubjects();

    // Build subject data: for each subject, gather all decks + their studyResults
    const subjectData = subjectNames.map(subjectName => {
        const decks = allUserDecks.filter(d => (d.subject || '').trim() === subjectName);
        let totalCorrect = 0;
        let totalResponses = 0;
        let totalSessions = 0;

        decks.forEach(deck => {
            const results = deck.studyResults || [];
            results.forEach(r => {
                totalCorrect += (r.correct || 0);
                totalResponses += ((r.correct || 0) + (r.incorrect || 0));
                totalSessions++;
            });
        });

        const score = totalResponses > 0 ? Math.round((totalCorrect / totalResponses) * 100) : -1; // -1 = not studied

        return {
            name: subjectName,
            decks: decks,
            score: score,
            totalCorrect: totalCorrect,
            totalResponses: totalResponses,
            totalSessions: totalSessions
        };
    });

    // Also check for unassigned decks that have study results
    const unassignedDecks = allUserDecks.filter(d => !(d.subject || '').trim());
    let unassignedCorrect = 0;
    let unassignedResponses = 0;
    let unassignedSessions = 0;
    unassignedDecks.forEach(deck => {
        const results = deck.studyResults || [];
        results.forEach(r => {
            unassignedCorrect += (r.correct || 0);
            unassignedResponses += ((r.correct || 0) + (r.incorrect || 0));
            unassignedSessions++;
        });
    });

    const hasAnyData = subjectData.some(s => s.totalSessions > 0) || unassignedSessions > 0;

    if (subjectData.length === 0 && unassignedDecks.length === 0) {
        tabContent.innerHTML = `

            scoreDisplay = '—';

// Drill-down view: show individual deck scores for a subject
function renderProgressSubjectDetail(subjectName) {
    setHeader(subjectName === '__GENERAL__' ? 'General Decks' : `📁 ${subjectName}`);
    const content = document.getElementById('app-content');

    const decks = subjectName === '__GENERAL__'
        ? allUserDecks.filter(d => !(d.subject || '').trim())
        : allUserDecks.filter(d => (d.subject || '').trim() === subjectName);

    // Calculate per-deck scores
    const deckData = decks.map(deck => {
        const results = deck.studyResults || [];
        let correct = 0, total = 0, sessions = results.length;
        results.forEach(r => {
            correct += (r.correct || 0);
            total += ((r.correct || 0) + (r.incorrect || 0));
        });
        const score = total > 0 ? Math.round((correct / total) * 100) : -1;
        return { id: deck.id, topic: deck.topic, score, correct, total, sessions, cardCount: (deck.cards || []).length };
    });

    // Overall subject aggregation
    let totalCorrect = 0, totalResponses = 0, totalSessions = 0;
    deckData.forEach(d => { totalCorrect += d.correct; totalResponses += d.total; totalSessions += d.sessions; });
    const overallScore = totalResponses > 0 ? Math.round((totalCorrect / totalResponses) * 100) : -1;

    let overallScoreColor = overallScore === -1 ? 'text-gray-400' : overallScore >= 80 ? 'text-green-500' : overallScore >= 60 ? 'text-yellow-500' : 'text-red-500';
    let overallRingColor = overallScore === -1 ? 'border-gray-300 dark:border-gray-600' : overallScore >= 80 ? 'border-green-500' : overallScore >= 60 ? 'border-yellow-500' : 'border-red-500';

    const deckCardsHTML = deckData.map(d => {
        let dScoreDisplay, dScoreColor, dBarColor;
        if (d.score === -1) {
            dScoreDisplay = '—';
            dScoreColor = 'text-gray-400 dark:text-gray-500';
            dBarColor = '';
        } else if (d.score >= 80) {
            dScoreDisplay = d.score + '%';
            dScoreColor = 'text-green-600 dark:text-green-400';
            dBarColor = 'bg-green-500';
        } else if (d.score >= 60) {
            dScoreDisplay = d.score + '%';
            dScoreColor = 'text-yellow-600 dark:text-yellow-400';
            dBarColor = 'bg-yellow-500';
        } else {
            dScoreDisplay = d.score + '%';
            dScoreColor = 'text-red-600 dark:text-red-400';
            dBarColor = 'bg-red-500';
        }

        return `
        <div class="progress-deck-card bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-4 cursor-pointer hover:shadow-md transition-all hover:-translate-y-0.5" data-deck-id="${d.id}" data-deck-topic="${d.topic.replace(/"/g, '&quot;')}">
            <div class="flex items-center justify-between mb-2">
                <h4 class="font-semibold text-gray-900 dark:text-white truncate flex-1 mr-3">${d.topic}</h4>
                <span class="text-xl font-bold ${dScoreColor} flex-shrink-0">${dScoreDisplay}</span>
            </div>
            <p class="text-xs text-gray-500 dark:text-gray-400">${d.cardCount} card${d.cardCount === 1 ? '' : 's'} · ${d.sessions} session${d.sessions === 1 ? '' : 's'}</p>
            ${d.score !== -1 ? `
            <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-1.5 mt-3">
                <div class="${dBarColor} h-1.5 rounded-full transition-all" style="width: ${d.score}%"></div>
            </div>
            <div class="flex justify-between text-xs text-gray-400 mt-1">
                <span>${d.correct} correct</span>
                <span>${d.total - d.correct} incorrect</span>
            </div>` : `
            <p class="text-xs text-gray-400 italic mt-2">Not studied yet</p>`}
        </div>`;
    }).join('');

    // Chart for studied decks
    const studiedDecks = deckData.filter(d => d.score !== -1);

    content.innerHTML = `
        <div class="max-w-5xl mx-auto">
            <div class="flex items-center mb-6">
                <button id="back-to-progress" class="flex items-center text-sm font-medium text-indigo-600 dark:text-indigo-400 hover:underline">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    Back to Progress
                </button>
            </div>
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 mb-8">
                <div class="flex flex-col sm:flex-row items-center justify-between gap-6">
                    <div class="text-center sm:text-left">
                        <h2 class="text-xl font-bold text-gray-900 dark:text-white">${subjectName === '__GENERAL__' ? 'General Decks' : subjectName}</h2>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">${decks.length} deck${decks.length === 1 ? '' : 's'} · ${totalSessions} study session${totalSessions === 1 ? '' : 's'}</p>
                        ${totalResponses > 0 ? `<p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5">${totalCorrect} correct out of ${totalResponses} total responses</p>` : ''}
                    </div>
                    <div class="w-24 h-24 flex items-center justify-center border-4 ${overallRingColor} rounded-full flex-shrink-0">
                        <span class="text-2xl font-bold ${overallScoreColor}">${overallScore === -1 ? '—' : overallScore + '%'}</span>
                    </div>
                </div>
            </div>

            ${studiedDecks.length > 0 ? `
            <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 mb-8">
                <h3 class="text-base font-semibold text-gray-900 dark:text-white mb-4">Deck Scores</h3>
                <div class="h-48">
                    <canvas id="subject-deck-chart"></canvas>
                </div>
            </div>` : ''}

            <h3 class="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-3">Individual Decks</h3>
            ${deckData.length > 0 ? `
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                ${deckCardsHTML}
            </div>` : `
            <div class="text-center py-8 text-gray-500 dark:text-gray-400">
                <p>No decks in this subject yet.</p>
            </div>`}
        </div>
    `;

    document.getElementById('back-to-progress').addEventListener('click', renderProgressView);

    // Draw deck chart
    if (studiedDecks.length > 0) {
        const ctx = document.getElementById('subject-deck-chart');
        if (ctx) {
            if (progressChartInstance) progressChartInstance.destroy();
            const isDark = document.documentElement.classList.contains('dark');
            progressChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: studiedDecks.map(d => d.topic),
                    datasets: [{
                        label: 'Score',
                        data: studiedDecks.map(d => d.score),
                        backgroundColor: studiedDecks.map(d => d.score >= 80 ? 'rgba(34,197,94,0.6)' : d.score >= 60 ? 'rgba(234,179,8,0.6)' : 'rgba(239,68,68,0.6)'),
                        borderColor: studiedDecks.map(d => d.score >= 80 ? 'rgb(34,197,94)' : d.score >= 60 ? 'rgb(234,179,8)' : 'rgb(239,68,68)'),
                        borderWidth: 1,
                        borderRadius: 6
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%', color: isDark ? '#9ca3af' : '#6b7280' }, grid: { color: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)' } },
                        y: { grid: { display: false }, ticks: { color: isDark ? '#e5e7eb' : '#374151' } }
                    },
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `Score: ${ctx.parsed.x}%` } } }
                }
            });
        }
    }

    // Deck card click => show session history for that deck
    content.querySelectorAll('.progress-deck-card').forEach(card => {
        card.addEventListener('click', () => {
            renderProgressDeckDetail(card.dataset.deckId, card.dataset.deckTopic, subjectName);
        });
    });
}

// Drill-down: individual deck session history
function renderProgressDeckDetail(deckId, deckTopic, parentSubject) {
    setHeader(`${deckTopic}`);
    const content = document.getElementById('app-content');

    const deck = allUserDecks.find(d => d.id === deckId);
    if (!deck) {
        content.innerHTML = '<div class="text-center text-red-500 py-8">Deck not found.</div>';
        return;
    }

    const results = (deck.studyResults || []).slice().sort((a, b) => {
        const ta = a.timestamp?.toDate ? a.timestamp.toDate() : new Date(a.timestamp);
        const tb = b.timestamp?.toDate ? b.timestamp.toDate() : new Date(b.timestamp);
        return ta - tb;
    });

    let totalCorrect = 0, totalResponses = 0;
    results.forEach(r => {
        totalCorrect += (r.correct || 0);
        totalResponses += ((r.correct || 0) + (r.incorrect || 0));
    });
    const overallScore = totalResponses > 0 ? Math.round((totalCorrect / totalResponses) * 100) : -1;
    let scoreColor = overallScore === -1 ? 'text-gray-400' : overallScore >= 80 ? 'text-green-500' : overallScore >= 60 ? 'text-yellow-500' : 'text-red-500';

    const sessionListHTML = results.length > 0 ? results.map((r, i) => {
        const ts = r.timestamp?.toDate ? r.timestamp.toDate() : new Date(r.timestamp);
        const dateStr = ts.toLocaleDateString() + ' ' + ts.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const correct = r.correct || 0;
        const incorrect = r.incorrect || 0;
        const pct = r.percentage || 0;
        let pctColor = pct >= 80 ? 'text-green-600 dark:text-green-400' : pct >= 60 ? 'text-yellow-600 dark:text-yellow-400' : 'text-red-600 dark:text-red-400';
        return `
        <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
            <div>
                <p class="text-sm font-medium text-gray-900 dark:text-white">Session ${i + 1}</p>
                <p class="text-xs text-gray-500 dark:text-gray-400">${dateStr}</p>
            </div>
            <div class="flex items-center space-x-4 text-sm">
                <span class="text-green-600 dark:text-green-400">${correct}✓</span>
                <span class="text-red-600 dark:text-red-400">${incorrect}✕</span>
                <span class="font-bold ${pctColor}">${pct}%</span>
            </div>
        </div>`;
    }).join('') : '<p class="text-sm text-gray-500 dark:text-gray-400 text-center py-4">No study sessions recorded yet.</p>';

    content.innerHTML = `
        <div class="max-w-3xl mx-auto">
            <div class="flex items-center mb-6">
                <button id="back-to-subject-progress" class="flex items-center text-sm font-medium text-indigo-600 dark:text-indigo-400 hover:underline">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    Back to ${parentSubject === '__GENERAL__' ? 'General Decks' : parentSubject}
                </button>
            </div>

            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 mb-8 text-center">
                <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-1">${deckTopic}</h2>
                <p class="text-sm text-gray-500 dark:text-gray-400">${(deck.cards || []).length} cards · ${results.length} session${results.length === 1 ? '' : 's'}</p>
                <div class="flex justify-center mt-4">
                    <div class="w-20 h-20 flex items-center justify-center border-4 ${overallScore === -1 ? 'border-gray-300 dark:border-gray-600' : overallScore >= 80 ? 'border-green-500' : overallScore >= 60 ? 'border-yellow-500' : 'border-red-500'} rounded-full">
                        <span class="text-xl font-bold ${scoreColor}">${overallScore === -1 ? '—' : overallScore + '%'}</span>
                    </div>
                </div>
                ${totalResponses > 0 ? `<p class="text-xs text-gray-500 dark:text-gray-400 mt-2">${totalCorrect} / ${totalResponses} correct across all sessions</p>` : ''}
            </div>

            ${results.length > 1 ? `
            <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 mb-8">
                <h3 class="text-base font-semibold text-gray-900 dark:text-white mb-4">Study Score Over Time</h3>
                <div class="h-52">
                    <canvas id="deck-history-chart"></canvas>
                </div>
            </div>` : ''}

            ${(deck.quizResults && deck.quizResults.length > 0) ? `
            <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 mb-8">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-base font-semibold text-gray-900 dark:text-white">AI Quiz Test Score Graph</h3>
                    <span class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold">${deck.quizResults.length} attempt(s)</span>
                </div>
                <div class="h-52">
                    <canvas id="deck-quiz-chart"></canvas>
                </div>
            </div>` : ''}

            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-5">
                <h3 class="text-base font-semibold text-gray-900 dark:text-white mb-4">Session History</h3>
                <div class="space-y-2">
                    ${sessionListHTML}
                </div>
            </div>

            <div class="mt-6 flex justify-center">
                <button id="study-this-deck-btn" class="px-6 py-2.5 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">Study This Deck</button>
            </div>
        </div>
    `;

    document.getElementById('back-to-subject-progress').addEventListener('click', () => renderProgressSubjectDetail(parentSubject));
    document.getElementById('study-this-deck-btn').addEventListener('click', () => {
        if (deck.cards && deck.cards.length > 0) {
            renderQuizModal(deck);
        } else {
            alert('This deck has no cards to study.');
        }
    });

    // Draw session history line chart
    const isDark = document.documentElement.classList.contains('dark');
    if (results.length > 1) {
        const ctx = document.getElementById('deck-history-chart');
        if (ctx) {
            const labels = results.map((r, i) => {
                const ts = r.timestamp?.toDate ? r.timestamp.toDate() : new Date(r.timestamp);
                return ts.toLocaleDateString();
            });
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Study Score (%)',
                        data: results.map(r => r.percentage || 0),
                        fill: true,
                        borderColor: 'rgb(99, 102, 241)',
                        backgroundColor: 'rgba(99, 102, 241, 0.1)',
                        tension: 0.3,
                        pointBackgroundColor: 'rgb(99, 102, 241)',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%', color: isDark ? '#9ca3af' : '#6b7280' }, grid: { color: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)' } },
                        x: { ticks: { color: isDark ? '#9ca3af' : '#6b7280' }, grid: { display: false } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }
    }

    // Draw AI Quiz test score chart if exists
    if (deck.quizResults && deck.quizResults.length > 0) {
        const qCtx = document.getElementById('deck-quiz-chart');
        if (qCtx) {
            const qResults = [...deck.quizResults].sort((a, b) => {
                const ta = a.timestamp?.toDate ? a.timestamp.toDate() : new Date(a.timestamp);
                const tb = b.timestamp?.toDate ? b.timestamp.toDate() : new Date(b.timestamp);
                return ta - tb;
            });
            new Chart(qCtx, {
                type: 'line',
                data: {
                    labels: qResults.map((r, i) => {
                        const ts = r.timestamp?.toDate ? r.timestamp.toDate() : new Date(r.timestamp);
                        return ts.toLocaleDateString() + ` (#${i + 1})`;
                    }),
                    datasets: [{
                        label: 'Test Score (%)',
                        data: qResults.map(r => r.percentage || 0),
                        fill: true,
                        borderColor: 'rgb(59, 130, 246)',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.3,
                        pointBackgroundColor: 'rgb(59, 130, 246)',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%', color: isDark ? '#9ca3af' : '#6b7280' }, grid: { color: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)' } },
                        x: { ticks: { color: isDark ? '#9ca3af' : '#6b7280' }, grid: { display: false } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }
    }
}

// Now saves the result before showing the view
async function renderQuizResultsView(score, totalQuestions, deck, userAnswers) {
    // This line saves the result to Firestore
    await saveQuizResult(deck.id, deck.topic, score, totalQuestions);

    setHeader(`Quiz Results: ${deck.topic}`);
    const content = document.getElementById('app-content');
    const percentage = totalQuestions > 0 ? Math.round((score / totalQuestions) * 100) : 0;
    const correctCount = userAnswers.filter(a => a.status === 'correct').length;
    const incorrectCount = userAnswers.filter(a => a.status === 'incorrect').length;
    const skippedCount = userAnswers.filter(a => a.status === 'skipped').length;

    // --- NEW: Logic for dynamic motivational messages ---
    let motivationalMessage = '';
    if (percentage >= 90) {
        motivationalMessage = "Absolutely brilliant! You've mastered this.";
    } else if (percentage >= 80) {
        motivationalMessage = "Great work! You're really getting the hang of this.";
    } else if (percentage >= 70) {
        motivationalMessage = "Solid effort! A little more review and you'll be an expert.";
    } else if (percentage >= 50) {
        motivationalMessage = "You're on the right track! Keep reviewing the tough spots.";
    } else {
        motivationalMessage = "Don't worry, every expert was once a beginner. Let's try again!";

    // --- END NEW LOGIC ---

    let scoreColorClass = 'text-red-500 border-red-500';
    if (percentage >= 75) {

    } else if (percentage >= 50) {
        scoreColorClass = 'text-yellow-500 border-yellow-500';

                        </div>
                    </div>
                </div>
            </div>
            
            <div class="mt-8 bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6">
                <h3 class="text-xl font-bold mb-4 text-gray-900 dark:text-white">Review your answers</h3>

async function saveQuizResult(deckId, deckTopic, score, totalQuestions) {

            // Get existing results or create a new array
            const results = data.quizResults || [];

            results.push({
                score: score,
                totalQuestions: totalQuestions,
                percentage: totalQuestions > 0 ? Math.round((score / totalQuestions) * 100) : 0,

function drawDeckTestScoreChart(deckId) {
    const deck = allUserDecks.find(d => d.id === deckId);
    if (!deck || !deck.quizResults || deck.quizResults.length === 0) return;

    const titleEl = document.getElementById('active-graph-title');
    const subEl = document.getElementById('active-graph-subtitle');
    if (titleEl) titleEl.textContent = `📈 ${deck.topic}: Test Score Graph`;
    if (subEl) subEl.textContent = `${deck.quizResults.length} test attempt(s) recorded over time`;

    // Sort results by timestamp ascending
    const results = [...deck.quizResults].sort((a, b) => {
        const ta = a.timestamp?.toDate ? a.timestamp.toDate() : new Date(a.timestamp);
        const tb = b.timestamp?.toDate ? b.timestamp.toDate() : new Date(b.timestamp);
        return ta - tb;
    });

    const labels = results.map((r, i) => {
        const ts = r.timestamp?.toDate ? r.timestamp.toDate() : new Date(r.timestamp);
        return ts.toLocaleDateString() + ` (#${i + 1})`;
    });
    const data = results.map(r => r.percentage);

    const ctx = document.getElementById('deck-performance-chart');
    if (!ctx) return;

    if (progressChartInstance) {
        progressChartInstance.destroy();
    }

    const isDark = document.documentElement.classList.contains('dark');

    progressChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Test Score (%)',
                data: data,
                fill: true,
                borderColor: 'rgb(79, 70, 229)',
                backgroundColor: isDark ? 'rgba(79, 70, 229, 0.15)' : 'rgba(79, 70, 229, 0.08)',
                borderWidth: 2.5,
                tension: 0.3,
                pointBackgroundColor: 'rgb(79, 70, 229)',
                pointBorderColor: isDark ? '#1f2937' : '#ffffff',
                pointBorderWidth: 2,
                pointRadius: 5,
                pointHoverRadius: 7
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    max: 100,
                    ticks: {
                        callback: v => v + '%',
                        color: isDark ? '#9ca3af' : '#6b7280'
                    },
                    grid: {
                        color: isDark ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.06)'
                    }
                },
                x: {
                    ticks: {
                        color: isDark ? '#9ca3af' : '#6b7280'
                    },
                    grid: {
                        display: false
                    }
                }
            },
            plugins: {
                legend: {
                    display: false
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const result = results[context.dataIndex];
                            return `Score: ${context.parsed.y}% (${result.score || 0}/${result.totalQuestions || 0} correct)`;
                        }
                    }
                }
            }
        }
    });
}

async function generateQuizWithAI(deck) {
            const cardContent = deck.cards.map(c => `Q: ${c.question}\nA: ${c.answer}`).join('\n\n');
            const questionCount = Math.max(deck.cards.length, 5); // Ensure at least 5 questions

            const prompt = `
                Generate a multiple-choice quiz based on the text I provide below.
You must follow these specific rules for the quiz's design:

Number of Questions: Generate exactly ${questionCount} questions.
Concise Options: Make all answer options (both correct and incorrect) as concise and least detailed as possible.
Answer Length: Avoid making the correct answer consistently the longest option. The correct answer should often be shorter than or roughly equal in length to the incorrect options (distractors).
Randomized Position: The correct answer MUST appear in a different position (index 0, 1, 2, or 3) for EACH question. Never put the correct answer in the same slot for consecutive questions.
JSON Output: The response MUST be a valid JSON array of objects. Each object must have keys "question", "options" (an array of 4 strings), and "correctAnswer" (a string matching one of the options). Do NOT include explanations or markdown.
Math & Science: Format all mathematical formulas and equations using standard LaTeX enclosed in $ for inline equations (e.g. $E=mc^2$) or $$ for block equations.


                Here is an example of the required format:
                [
                  {
                    "question": "What is the powerhouse of the cell?",
                    "options": ["Nucleus", "Ribosome", "Mitochondrion", "Chloroplast"],
                    "correctAnswer": "Mitochondrion"
                  }
                ]

                Flashcard Content:
                ---
                ${cardContent}
                ---
            `;

            try {
                const apiUrl = `/api/chat`;
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${ollamaApiKey}`
                    },
                    body: JSON.stringify({
                        model: ollamaModel,
                        messages: [{ role: 'user', content: prompt }],
                        format: 'json',
                        stream: false
                    })
                });

                if (!response.ok) throw new Error(`API error: ${response.status}`);
                
                const result = await response.json();
                let aiResponseText = result.message?.content;
                if (!aiResponseText) throw new Error("The AI returned an empty response.");
                
                // Clean up possible markdown formatting before parsing
                aiResponseText = aiResponseText.replace(/```(?:json)?/gi, '').replace(/```/g, '').trim();
                return JSON.parse(aiResponseText);

            } catch (error) {
                console.error("Error generating quiz with AI:", error);
                throw error; // Re-throw to be caught by the calling function
            }
        }

        function renderAIGeneratedQuizView(quizQuestions, deck) {

                    </div>

                    const isCorrect = selectedAnswer === q.correctAnswer;
                    document.removeEventListener('keydown', keyHandler);

                    userAnswers.push({

                        options: shuffledOptions,
                        correctAnswer: q.correctAnswer,
                        userAnswer: selectedAnswer,
                        status: isCorrect ? 'correct' : 'incorrect'
                    });

                    document.querySelectorAll('.quiz-option').forEach(btn => {
                        btn.disabled = true;
                        if (btn.dataset.answer === q.correctAnswer) {
                            btn.classList.add('bg-green-500', 'text-white', 'border-transparent');

                    const keyMap = { '1': 0, '2': 1, '3': 2, '4': 3 };
                    if (e.key in keyMap) {
                        const buttons = document.querySelectorAll('.quiz-option');
                        const btn = buttons[keyMap[e.key]];

                        options: shuffledOptions,

            try {
                // Use a transaction to ensure username uniqueness
                await runTransaction(db, async (transaction) => {
                    const usernameRef = doc(db, `artifacts/${appId}/usernames`, username.toLowerCase());
                    const usernameDoc = await transaction.get(usernameRef);

                    if (usernameDoc.exists()) {
                        throw new Error("Username is already taken."); // This will cancel the transaction
                    }

                    // Username is available, so create all necessary documents
                    // 1. Create the username lookup document
                    transaction.set(usernameRef, { userId: user.uid });
                    
                    // 2. Write to the main user document for searching
                    const userRef = doc(db, `/artifacts/${appId}/users`, user.uid);
                    transaction.set(userRef, { username: username }, { merge: true });

                    // 3. Write to the profile subcollection for display
                    const profileRef = doc(db, `/artifacts/${appId}/users/${user.uid}/profile`, 'details');
                    transaction.set(profileRef, {
                        username: username,
                        following: 0,
                        followers: 0
                    });

                throw error;
            }

        async function updateUserProfile(newUsername) {
            if (!userId || !newUsername || !userProfile) return;
            const oldUsername = userProfile.username;

            if (oldUsername.toLowerCase() === newUsername.toLowerCase()) {
                return; // No change needed
            }

            try {
                await runTransaction(db, async (transaction) => {
                    // 1. Check if the NEW username is already taken
                    const newUsernameRef = doc(db, `artifacts/${appId}/usernames`, newUsername.toLowerCase());
                    const newUsernameDoc = await transaction.get(newUsernameRef);
                    if (newUsernameDoc.exists()) {
                        throw new Error("Username is already taken.");
                    }
                    
                    const oldUsernameRef = doc(db, `artifacts/${appId}/usernames`, oldUsername.toLowerCase());
                    const oldUsernameDoc = await transaction.get(oldUsernameRef);

                    // 2. Only check and delete the old username document IF it exists
                    if (oldUsernameDoc.exists()) {
                        if (oldUsernameDoc.data().userId !== userId) {
                            throw new Error("Cannot change a username you don't own due to a data conflict.");
                        }
                        transaction.delete(oldUsernameRef);
                    }
                    
                    // 3. Create the new username document
                    transaction.set(newUsernameRef, { userId: userId });

                    // --- START OF FIX ---
                    // 4. Update (or create) the main user document for searching
                    const userRef = doc(db, `/artifacts/${appId}/users`, userId);
                    // Use set with merge:true instead of update
                    transaction.set(userRef, { username: newUsername }, { merge: true });
                    // --- END OF FIX ---

                    // 5. Update the profile subcollection for display
                    const profileRef = doc(db, `/artifacts/${appId}/users/${userId}/profile`, 'details');
                    transaction.update(profileRef, { username: newUsername });
                });
                alert('Profile updated successfully!');

                alert(`Error: ${error.message}`);

        function formatAIResponse(text) {
            // Replace **text** with <strong>text</strong>
            let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            // Split text into paragraphs based on double newlines
            const paragraphs = formattedText.split(/\n\s*\n/);

            return paragraphs.map(para => {
                const lines = para.split('\n');
                // Check if all non-empty lines in the paragraph start with '* '
                const isList = lines.filter(line => line.trim() !== '').every(line => line.trim().startsWith('* '));

                if (isList && lines.length > 0) {
                    const listItems = lines.map(line => `<li>${line.trim().substring(2).trim()}</li>`).join('');
                    return `<ul class="list-disc list-inside space-y-2 my-2">${listItems}</ul>`;
                } else {
                    // It's a regular paragraph, just join lines with line breaks and wrap in a p tag
                    return `<p>${para.replace(/\n/g, '<br>')}</p>`;
                }
            }).join('');
        }

        // Converts a File object to the { inlineData: { mimeType, data } } format Gemini needs
async function fileToGenerativePart(file) {
    const base64EncodedDataPromise = new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]); // Get only the base64 part
        reader.readAsDataURL(file);
    });

    return {
        inlineData: { data: await base64EncodedDataPromise, mimeType: file.type }
    };
}

                        units[unitIndex].topics = [...currentTopics, ...newTopics];
                        await updateDoc(subjectRef, { units: units });
                    }
                }
            } catch(e) { console.error("Error adding topics: ", e); }
        }

                if (docSnap.exists()) {

                        await updateDoc(subjectRef, { units: units });

        // --- Public Decks Logic ---
        async function makeDeckPublic(deckId, summary) {
            try {
                const privateDeckRef = doc(db, `/artifacts/${appId}/users/${userId}/decks`, deckId);
                const privateDeckSnap = await getDoc(privateDeckRef);

                if (privateDeckSnap.exists()) {
                    const deckData = privateDeckSnap.data();
                    const publicDecksCol = collection(db, `artifacts/${appId}/public_decks`);
                    
                    const batch = writeBatch(db);
                    
                    // Add to public collection
                    const newPublicDeckRef = doc(publicDecksCol); // Auto-generate ID
                    batch.set(newPublicDeckRef, {
                        topic: deckData.topic,
                        summary: summary,
                        cards: deckData.cards,
                        ownerId: userId,
                        originalDeckId: deckId,
                    });

                    // Update private deck status
                    batch.update(privateDeckRef, { isPublic: true });
                    
                    await batch.commit();
                    alert('Deck published successfully!');
                }
            } catch(e) {
                console.error("Error making deck public: ", e);
                alert('Failed to publish deck.');
            } finally {
                fetchAndDisplayDecks(); // Force re-render regardless of success or failure
            }
        }

        async function makeDeckPrivate(deckId) {
            if (!confirm('Are you sure you want to make this deck private? Others will no longer be able to see it.')) return;
            try {
                const publicDeckQuery = query(collection(db, `artifacts/${appId}/public_decks`), where("originalDeckId", "==", deckId), where("ownerId", "==", userId));
                const publicDeckSnapshot = await getDocs(publicDeckQuery);
                
                const batch = writeBatch(db);
                
                publicDeckSnapshot.forEach(doc => {
                    batch.delete(doc.ref);
                });

                const privateDeckRef = doc(db, `/artifacts/${appId}/users/${userId}/decks`, deckId);
                batch.update(privateDeckRef, { isPublic: false });
                
                await batch.commit();
                alert('Deck is now private.');

            } catch(e) {
                console.error("Error making deck private: ", e);
                alert('Failed to make deck private.');
            } finally {
                fetchAndDisplayDecks(); // Force re-render
            }
        }

                if (publicDeckSnap.exists()) {

                        summary: deckData.summary || ''

// --- Follow/Follower Logic ---

        async function sendFollowRequest(targetUserId) {
            if (!userId || userId === targetUserId) return;
            try {
                const requestsCol = collection(db, `artifacts/${appId}/follow_requests`);
                await addDoc(requestsCol, {
                    senderId: userId,
                    receiverId: targetUserId,
                    status: 'pending',
                    timestamp: new Date()
                });
                console.log("Follow request sent!");
            } catch (error) {
                console.error("Error sending follow request:", error);
            }
        }

        async function acceptFollowRequest(requestId, senderId, receiverId) {
            const batch = writeBatch(db);

            // 1. Add to the receiver's 'followers' list
            const followerRef = doc(db, `artifacts/${appId}/users/${receiverId}/followers`, senderId);
            batch.set(followerRef, { timestamp: new Date() });

            // 2. Add to the sender's 'following' list
            const followingRef = doc(db, `artifacts/${appId}/users/${senderId}/following`, receiverId);
            batch.set(followingRef, { timestamp: new Date() });

            // 3. Delete the original request document
            const requestRef = doc(db, `artifacts/${appId}/follow_requests`, requestId);
            batch.delete(requestRef);

            try {
                await batch.commit();
                console.log("Follow request accepted.");
            } catch (error) {
                console.error("Error accepting request:", error);
            }
        }
        
        async function rejectFollowRequest(requestId) {
            try {
                const requestRef = doc(db, `artifacts/${appId}/follow_requests`, requestId);
                await deleteDoc(requestRef);
                console.log("Follow request rejected.");
            } catch (error) {
                console.error("Error rejecting request:", error);
            }
        }

        async function cancelFollowRequest(targetUserId) {
            if (!userId) return;
            const q = query(collection(db, `artifacts/${appId}/follow_requests`), 
                where("senderId", "==", userId), 
                where("receiverId", "==", targetUserId)
            );
            const querySnapshot = await getDocs(q);
            if (!querySnapshot.empty) {
                const requestDoc = querySnapshot.docs[0];
                await deleteDoc(requestDoc.ref);
                console.log("Request cancelled.");
            }
        }

        async function getFollowStatus(targetUserId) {
            if (!userId) return 'NOT_LOGGED_IN';

            // 1. Check if they are already following
            const followingRef = doc(db, `artifacts/${appId}/users/${userId}/following`, targetUserId);
            const docSnap = await getDoc(followingRef);
            if (docSnap.exists()) {
                return 'FOLLOWING';
            }

            // 2. Check if a request has been sent
            const q = query(collection(db, `artifacts/${appId}/follow_requests`), 
                where("senderId", "==", userId), 
                where("receiverId", "==", targetUserId)
            );
            const requestSnapshot = await getDocs(q);
            if (!requestSnapshot.empty) {
                return 'REQUEST_SENT';
            }

            // 3. Otherwise, no relationship
            return 'NOT_FOLLOWING';
        }

        // Unfollow is the same as before, since it targets the accepted follow lists
        async function unfollowUser(targetUserId) {
            if (!userId || userId === targetUserId) return;
            const batch = writeBatch(db);
            const followingRef = doc(db, `artifacts/${appId}/users/${userId}/following`, targetUserId);
            batch.delete(followingRef);
            const followerRef = doc(db, `artifacts/${appId}/users/${targetUserId}/followers`, userId);
            batch.delete(followerRef);
            try {
                await batch.commit();
                console.log("User unfollowed successfully!");
            } catch (error) { // ADDED BRACES HERE
                console.error("Error unfollowing user: ", error);
            } // AND HERE
        }

        async function removeFollower(followerId) {
            if (!userId || userId === followerId) return;

            // This performs the reverse action of unfollowing
            const batch = writeBatch(db);

            // 1. Remove the user from your 'followers' list
            const followerRef = doc(db, `artifacts/${appId}/users/${userId}/followers`, followerId);
            batch.delete(followerRef);

            // 2. Remove yourself from their 'following' list
            const followingRef = doc(db, `artifacts/${appId}/users/${followerId}/following`, userId);
            batch.delete(followingRef);

            try {
                await batch.commit();
                console.log("Follower removed successfully!");
            } catch (error) {
                console.error("Error removing follower:", error);
            }
        }

        async function searchUsers(searchTerm) {
            if (!searchTerm.trim() || !userId) return [];
            
            const usersCol = collection(db, `artifacts/${appId}/users`);
            
            // This query now correctly targets the top-level 'username' field.
            const q = query(usersCol, 
                where("username", ">=", searchTerm),
                where("username", "<=", searchTerm + '\uf8ff')
            );

            try {
                const querySnapshot = await getDocs(q);
                const users = [];
                querySnapshot.forEach(doc => {
                    // Exclude the current user from search results
                    if (doc.id !== userId) {
                        users.push({
                            id: doc.id,
                            username: doc.data().username || 'Anonymous'
                        });
                    }
                });
                return users;
            } catch (error) {
                // IMPORTANT: The first time this runs, the error will contain a link
                // to create the necessary index in your Firebase console.
                console.error("Error searching users:", error);
                alert("Error searching users. You may need to create a database index. Check the console (F12) for a link.");
                return [];
            }
        }

        function debounce(func, delay) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), delay);
            };
        }

                const downloadURL = data.secure_url; // The public URL of the image
                
                // 2. Update Firestore with the new Cloudinary URL
                const batch = writeBatch(db);
                const userRef = doc(db, `/artifacts/${appId}/users`, userId);
                batch.set(userRef, { photoURL: downloadURL }, { merge: true });

                const profileRef = doc(db, `/artifacts/${appId}/users/${userId}/profile`, 'details');
                batch.update(profileRef, { photoURL: downloadURL });

                await batch.commit();
                console.log("Profile picture updated using Cloudinary!");

            } catch (error) {
                console.error("Error uploading to Cloudinary:", error);
                throw error;
            }
        }
		
// --- MODIFIED: Renders as a full page, answer is scrollable, comments removed ---
function renderQuizModal(deck) {
    let currentCardIndex = 0;
    let sessionCorrect = 0;
    let sessionIncorrect = 0;
    const cardResults = {}; // Track per-card results: cardIndex -> 'correct' | 'incorrect' | null
    const content = document.getElementById('app-content');

    setHeader(`${deck.topic} Study Session`);

    function showCard(index) {
        if (!deck.cards || index >= deck.cards.length) {
            // Session complete - show results
            const totalAnswered = sessionCorrect + sessionIncorrect;
            const percentage = totalAnswered > 0 ? Math.round((sessionCorrect / totalAnswered) * 100) : 0;

            let scoreColorClass = 'text-red-500 border-red-500';
            if (percentage >= 75) scoreColorClass = 'text-green-500 border-green-500';
            else if (percentage >= 50) scoreColorClass = 'text-yellow-500 border-yellow-500';

            let motivationalMessage = '';
            if (totalAnswered === 0) {
                motivationalMessage = "You didn't rate any cards. Try again and assess yourself!";
            } else if (percentage >= 90) {
                motivationalMessage = "Absolutely brilliant! You've mastered this.";
            } else if (percentage >= 80) {
                motivationalMessage = "Great work! You're really getting the hang of this.";
            } else if (percentage >= 70) {
                motivationalMessage = "Solid effort! A little more review and you'll be an expert.";
            } else if (percentage >= 50) {
                motivationalMessage = "You're on the right track! Keep reviewing the tough spots.";
            } else {
                motivationalMessage = "Don't worry, every expert was once a beginner. Let's try again!";
            }

            const unanswered = deck.cards.length - totalAnswered;

            content.innerHTML = `
                <div class="max-w-2xl mx-auto">
                    <div class="text-center p-8 bg-white dark:bg-gray-800 rounded-2xl shadow-lg">
                        <h2 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white">${motivationalMessage}</h2>
                        <div class="flex justify-center items-center space-x-12 mb-6">
                            <div class="flex flex-col items-center">
                                <div class="w-32 h-32 flex items-center justify-center border-4 ${scoreColorClass} rounded-full mb-2">
                                    <span class="text-4xl font-bold ${scoreColorClass}">${totalAnswered > 0 ? percentage + '%' : '—'}</span>
                                </div>
                                <span class="font-semibold text-lg text-gray-900 dark:text-white">Score</span>
                            </div>
                            <div class="text-left space-y-3">
                                <div class="flex items-center">
                                    <div class="w-8 h-8 rounded-full bg-green-100 dark:bg-green-900/40 flex items-center justify-center mr-3">
                                        <svg class="w-5 h-5 text-green-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg>
                                    </div>
                                    <span class="text-gray-700 dark:text-gray-200"><strong class="text-gray-900 dark:text-white">${sessionCorrect}</strong> Correct</span>
                                </div>
                                <div class="flex items-center">
                                    <div class="w-8 h-8 rounded-full bg-red-100 dark:bg-red-900/40 flex items-center justify-center mr-3">
                                        <svg class="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
                                    </div>
                                    <span class="text-gray-700 dark:text-gray-200"><strong class="text-gray-900 dark:text-white">${sessionIncorrect}</strong> Incorrect</span>
                                </div>
                                ${unanswered > 0 ? `
                                <div class="flex items-center">
                                    <div class="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center mr-3">
                                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
                                    </div>
                                    <span class="text-gray-700 dark:text-gray-200"><strong class="text-gray-900 dark:text-white">${unanswered}</strong> Skipped</span>
                                </div>` : ''}
                            </div>
                        </div>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Studied ${deck.cards.length} card${deck.cards.length === 1 ? '' : 's'}</p>
                    </div>
                    <div class="mt-8 flex justify-center space-x-4">
                        <button id="study-again-btn" class="px-8 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold transition">Study Again</button>
                        <button id="study-back-to-deck-btn" class="px-8 py-3 bg-gray-200 dark:bg-gray-600 text-gray-900 dark:text-white rounded-lg hover:bg-gray-300 dark:hover:bg-gray-500 font-semibold transition">Back to Deck</button>
                    </div>
                </div>
            `;

            // Save the session result if the deck is a real deck (not a combined subject deck)
            if (!deck.id.startsWith('subject-') && totalAnswered > 0) {
                saveStudySessionResult(deck.id, sessionCorrect, sessionIncorrect, deck.cards.length);
            }

            document.getElementById('study-again-btn').addEventListener('click', () => renderQuizModal(deck));
            document.getElementById('study-back-to-deck-btn').addEventListener('click', () => {
                if (deck.id.startsWith('subject-')) {
                    renderDecksView(allUserDecks);
                } else {
                    renderSingleDeckView(deck.id);
                }
            });
            return;
        }

        const cardData = deck.cards[index];
        const existingResult = cardResults[index]; // 'correct', 'incorrect', or undefined

        content.innerHTML = `
            <div class="max-w-2xl mx-auto flex flex-col items-center">
                <div class="w-full flex justify-between items-center mb-4">
                     <button id="study-back-btn" class="flex items-center text-sm font-medium text-indigo-600 dark:text-indigo-400 hover:underline">
                           <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                           Back to Deck
                     </button>
                     <span class="text-sm font-medium text-gray-500 dark:text-gray-400">
                        <span class="text-green-500">${sessionCorrect}✓</span> · <span class="text-red-500">${sessionIncorrect}✕</span>
                     </span>
                </div>

                <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-1.5 mb-4">
                    <div class="bg-indigo-600 h-1.5 rounded-full transition-all duration-300" style="width: ${Math.round(((index) / deck.cards.length) * 100)}%"></div>
                </div>

                <p class="text-sm text-gray-500 dark:text-gray-400 mb-2">${index + 1} / ${deck.cards.length}</p>
                <div class="scene w-full h-80 mb-6">
                    <div id="quiz-card" class="card relative w-full h-full cursor-pointer">

                        <div class="card-face absolute w-full h-full flex items-center justify-center p-8 bg-gradient-to-br from-white to-gray-100 dark:from-gray-800 dark:to-gray-900 shadow-xl rounded-xl border border-gray-200 dark:border-gray-700">
                             <div class="flex flex-col h-full justify-between w-full">
                                <span class="text-sm font-medium text-gray-500 dark:text-gray-400">Question</span>
                                <p class="text-xl font-medium text-gray-900 dark:text-white text-center">
                                    ${cardData.question}
                                </p>
                                <div class="h-6"></div>
                            </div>
                        </div>

                        <div class="card-face card-face-back absolute w-full h-full flex items-center justify-center p-8 bg-gradient-to-br from-blue-500 to-indigo-700 dark:from-blue-600 dark:to-indigo-800 shadow-xl rounded-xl overflow-y-auto">
                             <div class="flex flex-col h-full justify-between w-full">
                                <span class="text-sm font-medium text-blue-200">Answer</span>
                                <p class="text-xl font-semibold text-white text-center">
                                    ${cardData.answer}
                                </p>
                                <div class="h-6"></div>
                            </div>
                        </div>

                    </div>
                </div>
                 <div id="explain-btn-container" class="h-12 flex justify-center items-center">
                </div>

                <!-- Self-assessment buttons (✓ / ✕) -->
                <div id="self-assess-container" class="flex items-center justify-center space-x-6 mb-4">
                    <button id="mark-incorrect-btn" class="group flex items-center justify-center w-14 h-14 rounded-full border-2 transition-all duration-200 ${existingResult === 'incorrect' ? 'bg-red-500 border-red-500 text-white scale-110 shadow-lg shadow-red-500/30' : 'border-red-300 dark:border-red-700 text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 hover:border-red-500 hover:scale-105'}" title="I got this wrong">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                    <button id="mark-correct-btn" class="group flex items-center justify-center w-14 h-14 rounded-full border-2 transition-all duration-200 ${existingResult === 'correct' ? 'bg-green-500 border-green-500 text-white scale-110 shadow-lg shadow-green-500/30' : 'border-green-300 dark:border-green-700 text-green-500 hover:bg-green-50 dark:hover:bg-green-950/30 hover:border-green-500 hover:scale-105'}" title="I got this right">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                    </button>
                </div>

                <div class="mt-1 flex items-center justify-center space-x-4">
                    <button id="prev-card-btn" class="px-6 py-2 rounded-lg bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600 transition-colors" ${index === 0 ? 'disabled' : ''}>Previous</button>
                    <button id="flip-card-btn" class="px-6 py-2 rounded-lg bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600 transition-colors">Flip</button>
                    <button id="next-card-btn" class="px-6 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition-colors">Next</button>
                </div>
            </div>
        `;

         document.getElementById('study-back-btn').addEventListener('click', () => {
             if (deck.id.startsWith('subject-')) {
                 renderDecksView(allUserDecks);
             } else {
                 renderSingleDeckView(deck.id);
             }
         });

        renderMath(document.getElementById('quiz-card'));
        const cardElement = document.getElementById('quiz-card');
        const explainContainer = document.getElementById('explain-btn-container');

        function flipCard() {
            cardElement.classList.toggle('is-flipped');
            renderMath(cardElement);
             if (cardElement.classList.contains('is-flipped')) {
                explainContainer.innerHTML = `
                    <button id="explain-card-btn" class="px-4 py-2 text-sm rounded-lg bg-gray-200 dark:bg-gray-600 hover:bg-gray-300 dark:hover:bg-gray-500 flex items-center">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a2 2 0 01-2-2V10a2 2 0 012-2h8z"></path></svg>
                        Explain
                    </button>`;
                const explainBtn = document.getElementById('explain-card-btn');
                if (explainBtn) {
                     explainBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        renderChatbotModal(cardData);
                    });
                }
            } else {
                explainContainer.innerHTML = '';
            }
        }

        if (cardElement) cardElement.addEventListener('click', flipCard);
        const flipBtn = document.getElementById('flip-card-btn');
        if (flipBtn) flipBtn.addEventListener('click', flipCard);

        // Self-assessment handlers
        function markResult(result) {
            const previousResult = cardResults[index];
            // Undo previous result for this card if changing
            if (previousResult === 'correct') sessionCorrect--;
            if (previousResult === 'incorrect') sessionIncorrect--;

            cardResults[index] = result;
            if (result === 'correct') sessionCorrect++;
            if (result === 'incorrect') sessionIncorrect++;

            // Auto-advance to next card after a short delay
            setTimeout(() => {
                currentCardIndex++;
                showCard(currentCardIndex);
            }, 250);
        }

        document.getElementById('mark-correct-btn').addEventListener('click', () => markResult('correct'));
        document.getElementById('mark-incorrect-btn').addEventListener('click', () => markResult('incorrect'));

        const nextBtn = document.getElementById('next-card-btn');
        if (nextBtn) nextBtn.addEventListener('click', () => {
            currentCardIndex++;
            showCard(currentCardIndex);
        });
        const prevBtn = document.getElementById('prev-card-btn');
        if (prevBtn) prevBtn.addEventListener('click', () => {
            currentCardIndex--;
            showCard(currentCardIndex);
        });
    }

    showCard(currentCardIndex);
}
